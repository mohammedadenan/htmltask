<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <h1>User Registration</h1>
        <h2>Registration form</h2>
        
        <table>
            
            <tr>
                <th>Firstname:</th>
                <td><input type="text" required minlength="3" placeholder="enter your Firstname"></td>
            </tr>
            
            <tr>
                <th>Lastname:</th>
            <td><input type="text" required placeholder="enter Lastname"></td>
            </tr>

            <tr>
                <th>DOB:</th>
                <td><input type="date" required ></td>
            </tr>

            <tr>
                <th>Gender:</th>
                <td><input type="radio" name="gender" value="male" required>Male</td>
                <td><input type="radio" name="gender" value="female">Female</td>
            </tr>
            <tr>
                <th>Qualification:</th>
                <td><input type="checkbox" value="plustwo" >+2</td>
                <td><input type="checkbox" value="ug" >UG</td>
                <td><input type="checkbox" value="pg" >PG</td>
            </tr>
            <tr>
                <th>Address:</th>
                <td><textarea name="adress" id="" rows="4" cols="25"></textarea></td>
            </tr>
            <tr>
                <th>State:</th>
                <td><select name="" id="select1">
                    <option value="">Select State</option>
                    <option value="kl">Kerala</option>
                    <option value="ap">Andhra Pradesh</option>
                    <option value="ar">Arunachal Pradesh</option>
                    <option value="as">Assam</option>
                    <option value="br">Bihar</option>
                    <option value="cg">Chhattisgarh</option>
                    <option value="ga">Goa</option>
                    <option value="gj">Gujarat</option>
                    <option value="hr">Haryana</option>
                    <option value="hp">Himachal Pradesh</option>
                    <option value="jh">Jharkhand</option>
                    <option value="ka">Karnataka</option>
                    <option value="mp">Madhya Pradesh</option>
                    <option value="mh">Maharashtra</option>
                    <option value="mn">Manipur</option>
                    <option value="ml">Meghalaya</option>
                    <option value="mz">Mizoram</option>
                    <option value="nl">Nagaland</option>
                    <option value="od">Odisha</option>
                    <option value="pb">Punjab</option>
                    <option value="rj">Rajasthan</option>
                    <option value="sk">Sikkim</option>
                    <option value="tn">Tamil Nadu</option>
                    <option value="ts">Telangana</option>
                    <option value="tr">Tripura</option>
                    <option value="up">Uttar Pradesh</option>
                    <option value="uk">Uttarakhand</option>
                    <option value="wb">West Bengal</option>

                </select>
            </td>
            </tr>

            <tr>
                <th>Pin Code:</th>
                <td>
                    <input type="text" name="pincode" pattern="[1-9][0-9]{5}" maxlength="6" minlength="6" inputmode="numeric" required>
                </td>
            </tr>

            <tr>
                <th>Email:</th>
                <td>
                    <input type="email" required>
                </td>
            </tr>
            <tr>
                <th>Phone:</th>
                <td><input type="tel" name="phone" pattern="[6-9][0-9]{9}" maxlength="10" inputmode="numeric" required></td>
            </tr>

            <tr>
                <th>Username:</th>
                <td><input type="text" minlength="3" maxlength="10" ></td>
            </tr>
            
            <tr>
                <th>Password:</th>
                <td><input type="password" name="password" minlength="8" maxlength="16" required></td>
            </tr>
            <tr>
                <td colspan="2"><button>Submit</button></td>
            </tr>
        </table>
    </form>
</body>
</html>
